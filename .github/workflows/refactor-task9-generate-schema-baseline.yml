name: Refactor Task 9 Schema Baseline Generator

on:
  push:
    branches:
      - agent/refactor-phase0-task9-schema-fingerprint

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate schema baseline
        run: node scripts/refactor/schema-fingerprint.mjs

      - name: Verify schema baseline
        run: node scripts/refactor/schema-fingerprint.mjs --check

      - name: Verify schema fingerprint test
        run: |
          npm ci
          npm test -- tests/refactor/foundation/schema-fingerprint.test.ts --runInBand

      - name: Commit generated baseline
        run: |
          if git diff --quiet -- docs/superpowers/reports/2026-07-19-schema-baseline.json; then
            echo "Schema baseline already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/reports/2026-07-19-schema-baseline.json
          git commit -m "docs(refactor): lock the Prisma schema baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
