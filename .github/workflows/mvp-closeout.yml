name: Link168 SaaS Full Gates

on:
  push:
    branches:
      - master
      - recovery/direct-goal-closeout-20260722
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link168-saas-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: link168
          POSTGRES_PASSWORD: link168
          POSTGRES_DB: link168_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U link168 -d link168_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://link168:link168@127.0.0.1:5432/link168_ci
      SESSION_SECRET: link168-saas-full-gates-ci-session-secret-2026
      ADMIN_SECRET: link168-saas-full-gates-ci-admin-secret-2026
      CONFIG_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_APP_URL: https://example.invalid
      PAYMENT_RECONCILE_SECRET: link168-saas-full-gates-ci-payment-secret-2026
      MAIL_ENABLED: "false"
      COOKIE_SECURE: "true"
      RATE_LIMIT_STORE: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply test migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Release preflight
        env:
          NODE_ENV: production
        run: npm run release:preflight

      - name: Standalone runtime smoke
        env:
          RELEASE_SMOKE_REQUIRE_DB: "true"
        run: npm run release:smoke

      - name: Diff check
        run: git diff --check
