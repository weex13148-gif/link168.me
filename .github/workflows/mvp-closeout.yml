name: Link168 Refactor Gate

on:
  push:
    branches:
      - master
      - refactor/link168-modular-monolith-r1
  pull_request:
    branches:
      - master
      - refactor/link168-modular-monolith-r1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link168-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: link168
          POSTGRES_DB: link168_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U link168 -d link168_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://link168@127.0.0.1:5432/link168_ci
      REDIS_URL: redis://127.0.0.1:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MAIL_ENABLED: "false"
      COOKIE_SECURE: "false"
      RATE_LIMIT_STORE: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare CI-only runtime values
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CONFIG_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Verify approved baseline
        run: node scripts/refactor/verify-baseline.mjs

      - name: Verify direct dependency policy
        run: npm run check:dependencies

      - name: Verify domain boundaries
        run: npm run check:boundaries

      - name: Verify schema fingerprint
        run: node scripts/refactor/schema-fingerprint.mjs --check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply test migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          npm test -- --runInBand --json --outputFile=test-results/jest-results.json > test-results/jest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Jest failed; structured diagnostics will be uploaded."
            exit "$status"
          fi
          tail -n 40 test-results/jest.log

      - name: Upload Jest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-diagnostics
          path: test-results
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

  sync-task8-generated-client:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/refactor-phase1-task8-media-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-phase1-task8-media-assets
          fetch-depth: 1
          show-progress: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and normalize Prisma client
        shell: bash
        run: |
          npx prisma generate
          python3 - <<'PY'
          from pathlib import Path
          root = Path("src/generated/prisma")
          for file in root.rglob("*"):
              if not file.is_file():
                  continue
              try:
                  text = file.read_text()
              except UnicodeDecodeError:
                  continue
              normalized = "\n".join(line.rstrip(" \t") for line in text.splitlines())
              if text.endswith(("\n", "\r")):
                  normalized += "\n"
              file.write_text(normalized)
          PY
          mkdir -p task8-diagnostics
          set +e
          git diff --check > task8-diagnostics/generated-diff.log 2>&1
          status=$?
          cat task8-diagnostics/generated-diff.log
          exit "$status"

      - name: Upload generated client diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task8-generated-diff
          path: task8-diagnostics/generated-diff.log
          retention-days: 1

      - name: Restore standard gate and commit generated client
        run: |
          git fetch --depth=1 origin refactor/link168-modular-monolith-r1
          git checkout FETCH_HEAD -- .github/workflows/mvp-closeout.yml
          rm -rf task8-diagnostics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/prisma .github/workflows/mvp-closeout.yml
          git commit -m "chore(prisma): sync media asset client"
          git push origin HEAD:agent/refactor-phase1-task8-media-assets
