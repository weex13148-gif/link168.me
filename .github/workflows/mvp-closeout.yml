name: Link168 Refactor Gate

on:
  push:
    branches:
      - master
      - refactor/link168-modular-monolith-r1
  pull_request:
    branches:
      - master
      - refactor/link168-modular-monolith-r1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link168-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: link168
          POSTGRES_DB: link168_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U link168 -d link168_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://link168@127.0.0.1:5432/link168_ci
      REDIS_URL: redis://127.0.0.1:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MAIL_ENABLED: "false"
      COOKIE_SECURE: "false"
      RATE_LIMIT_STORE: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare CI-only runtime values
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CONFIG_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Materialize remaining Product status cutover
        if: github.head_ref == 'agent/refactor-phase2-task1-catalog-page-persistence'
        run: |
          node scripts/refactor/materialize-phase2-task1-remaining-status.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'src/app/%5F_w/[workspaceId]/p/[slug]/page.tsx' 'src/app/%5F_w/[workspaceId]/page.tsx' 'src/app/%5F_w/[workspaceId]/products/page.tsx' 'src/app/api/[username]/products/route.ts' src/app/api/contact/route.ts src/app/workbench/ai/reception/page.tsx src/lib/billing/entitlements/index.ts tests/product-binding-order.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(catalog): finish Product status cutover"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify approved baseline
        run: node scripts/refactor/verify-baseline.mjs

      - name: Verify direct dependency policy
        run: npm run check:dependencies

      - name: Verify domain boundaries
        run: npm run check:boundaries

      - name: Verify schema fingerprint
        run: node scripts/refactor/schema-fingerprint.mjs --check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply test migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          npm test -- --runInBand --json --outputFile=test-results/jest-results.json > test-results/jest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Jest failed; structured diagnostics will be uploaded."
            exit "$status"
          fi
          tail -n 40 test-results/jest.log

      - name: Upload Jest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-diagnostics
          path: test-results
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check
