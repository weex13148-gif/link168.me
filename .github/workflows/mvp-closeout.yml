name: MVP Closeout

on:
  push:
    branches:
      - master
      - integration/mvp-closeout-r1
      - integration/release-risk-closeout-20260716
      - "agent/p0-**"
  pull_request:
    branches:
      - master
      - integration/mvp-closeout-r1
      - integration/release-risk-closeout-20260716
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mvp-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: link168
          POSTGRES_PASSWORD: link168
          POSTGRES_DB: link168_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U link168 -d link168_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://link168:link168@127.0.0.1:5432/link168_ci
      SESSION_SECRET: link168-mvp-closeout-ci-session-secret-2026
      ADMIN_SECRET: link168-mvp-closeout-ci-admin-secret-2026
      CONFIG_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PAYMENT_RECONCILE_SECRET: link168-mvp-closeout-ci-payment-secret-2026
      MAIL_ENABLED: "false"
      COOKIE_SECURE: "false"
      RATE_LIMIT_STORE: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply P0-D patch once
        if: github.ref == 'refs/heads/agent/p0-ai-risk-boundaries-20260716'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          commercial = 'src/lib/ai/commercial-agent.ts'
          replace(commercial,
              'import { logAiRiskEvent } from "@/lib/ai/risk-log";\n',
              'import { logAiRiskEvent } from "@/lib/ai/risk-log";\nimport { classifyAiBusinessRisk } from "@/lib/ai/business-risk";\n')
          replace(commercial,
              '    reply: string;\n    conversationId: string;',
              '    reply: string;\n    replyKind: "ai" | "preset";\n    conversationId: string;')
          replace(commercial,
              '        reply: "",\n        conversationId: "",',
              '        reply: "",\n        replyKind: "preset",\n        conversationId: "",')

          provider = ('  const resolved = resolveEnterpriseBailianConfig(platformConfig);\n'
                      '  if (!isBailianApplicationConfigured(resolved)) {\n'
                      '    return { success: false, status: 503, error: "AI 服务暂不可用，请稍后再试。", code: "AI_NOT_CONFIGURED", traceId: traceCtx.traceId };\n'
                      '  }\n\n')
          p = Path(commercial)
          text = p.read_text()
          if provider in text:
              p.write_text(text.replace(provider, '', 1))

          risk_block = '''

  const businessRisk = classifyAiBusinessRisk(message);
  if (businessRisk.level !== 1) {
    if (businessRisk.level >= 3) {
      await logAiRiskEvent({
        userId: profile.user.id,
        eventType: "manual_review",
        assistant: kind,
        riskLevel: businessRisk.riskLevel,
        metadata: {
          category: businessRisk.code,
          traceId: traceCtx.traceId,
          source: "commercial-agent-business-risk",
        },
      });
    }

    const privacyNotice = buildPrivacyNoticeFromConfig({
      collectLead: serviceConfig.collectLead,
      allowReport: serviceConfig.allowReport,
      allowTransferToHuman: false,
      privacyNoticeText: serviceConfig.privacyNoticeText,
    });

    return {
      success: true,
      status: 200,
      traceId: traceCtx.traceId,
      data: {
        agent: kind,
        reply: businessRisk.reply,
        replyKind: "preset",
        conversationId: "",
        visitorSessionId,
        action: businessRisk.level === 3
          ? { type: "contact", label: "联系确认" }
          : { type: "reply" },
        leadCaptured: false,
        creditBalance: guard.entitlements.limits.aiChatsPerMonth.remaining,
        privacyNotice,
        collectLeadEnabled: serviceConfig.collectLead,
        transferToHumanEnabled: false,
        allowReportEnabled: serviceConfig.allowReport,
      },
    };
  }

  const resolved = resolveEnterpriseBailianConfig(platformConfig);
  if (!isBailianApplicationConfigured(resolved)) {
    return { success: false, status: 503, error: "AI 服务暂不可用，请稍后再试。", code: "AI_NOT_CONFIGURED", traceId: traceCtx.traceId };
  }
'''
          replace(commercial,
              '    return { success: false, status: 400, error: "问题包含平台限制内容，请修改后重试。", code: "SENSITIVE_CONTENT", traceId: traceCtx.traceId };\n  }\n\n  const requestedConversationId',
              '    return { success: false, status: 400, error: "问题包含平台限制内容，请修改后重试。", code: "SENSITIVE_CONTENT", traceId: traceCtx.traceId };\n  }' + risk_block + '\n  const requestedConversationId')
          replace(commercial,
              '      reply,\n      conversationId: conversation.id,',
              '      reply,\n      replyKind: "ai",\n      conversationId: conversation.id,')
          replace('src/components/share/modules/AiChatModule.tsx',
              '  data?: { reply?: string };',
              '  data?: { reply?: string; replyKind?: "ai" | "preset" };')
          replace('src/components/share/modules/AiChatModule.tsx',
              '        appendMessage("assistant", reply, "ai");',
              '        appendMessage("assistant", reply, result.data.replyKind === "preset" ? "preset" : "ai");')
          replace('tests/ai-reception-ui-closeout.test.ts',
              '    expect(chat).toContain(\'appendMessage("assistant", reply, "ai")\');',
              '    expect(chat).toContain(\'appendMessage("assistant", reply, result.data.replyKind === "preset" ? "preset" : "ai")\');')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "Link168 P0 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "fix: route high-risk AI questions deterministically"
          git push origin HEAD:agent/p0-ai-risk-boundaries-20260716

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply test migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Release preflight
        run: npm run release:preflight

      - name: Standalone runtime smoke
        run: npm run release:smoke

      - name: Diff check
        run: git diff --check
