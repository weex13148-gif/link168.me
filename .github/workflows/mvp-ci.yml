name: MVP CI

on:
  push:
    branches:
      - 'agent/**'
      - 'integration/**'
  pull_request:
    branches:
      - 'master'
      - 'integration/**'

jobs:
  mvp-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/link168_test' }}
        run: npx prisma validate

      - name: Prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/link168_test' }}
        run: npx prisma generate

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Git diff check
        run: git diff --check
