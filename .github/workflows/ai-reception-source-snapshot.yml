name: AI Reception Source Snapshot

on:
  pull_request:
    branches:
      - integration/mvp-closeout-r1

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply exact AI reception schema field
        id: schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("prisma/schema.prisma")
          text = path.read_text()
          field = '  quickActionsJson            String?  @map("quick_actions_json")\n'
          if field in text:
              print("Schema field already present")
              Path("/tmp/schema_changed").write_text("false")
          else:
              needle = '  privacyNoticeText          String?  @map("privacy_notice_text")\n'
              if needle not in text:
                  raise SystemExit("AiServiceConfig insertion point not found")
              path.write_text(text.replace(needle, needle + field, 1))
              Path("/tmp/schema_changed").write_text("true")
          PY
          echo "changed=$(cat /tmp/schema_changed)" >> "$GITHUB_OUTPUT"

      - name: Commit exact schema patch
        if: steps.schema.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "feat: persist AI reception quick actions"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload AI reception source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ai-reception-source-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            prisma/schema.prisma
            src/components/ai/**
            src/components/dashboard/**
            src/components/share/**
            src/lib/ai/**
            src/lib/app-config.ts
            src/app/**/page.tsx
            src/features/profile-modules/**
            tests/profile-module-closeout.test.ts
