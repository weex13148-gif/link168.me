name: Apply P0-C Membership Expiry

on:
  push:
    branches:
      - agent/p0-membership-expiry-20260716

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-membership-expiry-20260716
          fetch-depth: 0

      - name: Apply exact membership expiry patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/lib/billing/membership-lifecycle.ts',
              '    status: "active",\n    planCode: { not: "free" },',
              '    status: { in: ["active", "past_due"] },\n    planCode: { not: "free" },',
          )
          replace(
              'src/lib/billing/membership-lifecycle.ts',
              '  if (sub.planCode === "free" || sub.status !== "active") {',
              '  if (sub.planCode === "free" || !["active", "past_due"].includes(sub.status)) {',
          )
          replace(
              'src/lib/billing/membership-lifecycle.ts',
              '  const graceDaysRemaining = GRACE_PERIOD_DAYS - daysSinceExpired;\n\n  const updated = await db.membershipSubscription.update({',
              '''  const graceDaysRemaining = GRACE_PERIOD_DAYS - daysSinceExpired;

  if (sub.status === "past_due") {
    return {
      userId: sub.userId,
      action: "grace_period",
      previousPlan: sub.planCode,
      newPlan: sub.planCode,
      previousStatus: sub.status,
      newStatus: sub.status,
      reason: `宽限期第 ${daysSinceExpired + 1} 天，剩余 ${graceDaysRemaining} 天`,
    };
  }

  const updated = await db.membershipSubscription.update({''',
          )
          replace(
              'src/lib/billing/entitlements/index.ts',
              '  if (subscription?.status === "active") {',
              '  if (subscription && ["active", "past_due"].includes(subscription.status)) {',
          )
          PY

      - name: Commit patch
        run: |
          git config user.name "Link168 P0 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "fix: enforce membership expiry and grace behavior"
          git push origin HEAD:agent/p0-membership-expiry-20260716
