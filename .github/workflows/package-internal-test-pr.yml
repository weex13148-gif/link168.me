name: Package Internal Test Upload

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: link168_release_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d link168_release_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare isolated CI environment
        shell: bash
        run: |
          echo "DATABASE_URL=postgresql://postgres@127.0.0.1:5432/link168_release_ci" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CONFIG_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://122.51.183.200" >> "$GITHUB_ENV"
          echo "COOKIE_SECURE=false" >> "$GITHUB_ENV"
          echo "COOKIE_SAME_SITE=lax" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_STORE=memory" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Validate database and code
        shell: bash
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npm run lint
          npm run typecheck

      - name: Build production standalone
        run: NODE_OPTIONS="--max-old-space-size=3072" npm run build

      - name: Assemble upload package
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${RELEASE_SHA:0:12}"
          RELEASE_NAME="link168-internal-test-${SHORT_SHA}"
          RELEASE_DIR="dist/${RELEASE_NAME}"

          test -f .next/standalone/server.js
          rm -rf dist
          mkdir -p "${RELEASE_DIR}/.next"
          cp -a .next/standalone/. "${RELEASE_DIR}/"
          cp -a .next/static "${RELEASE_DIR}/.next/static"
          cp -a public "${RELEASE_DIR}/public"
          cp -a prisma "${RELEASE_DIR}/prisma"
          cp -a .env.example "${RELEASE_DIR}/.env.example"

          cat > "${RELEASE_DIR}/RELEASE_INFO.txt" <<EOF
          Link168 internal test upload package
          Branch: release/internal-test-upload-20260701
          Commit: ${RELEASE_SHA}
          BuiltAtUTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Runtime: Node.js 22
          PublicBaseUrl: http://122.51.183.200
          Start: HOSTNAME=127.0.0.1 PORT=3000 node server.js
          Secrets: not included
          Database: not included
          User uploads: not included
          EOF

          cat > "${RELEASE_DIR}/DEPLOY_TEST.txt" <<'EOF'
          Link168 腾讯云测试上传说明

          本包为 Next.js standalone 运行包，不需要在服务器执行 next build。
          本包不含 .env、数据库、第三方密钥、邮件密码或 public/uploads。
          上传并解压后，将服务器原有 .env.local 放入本包根目录。
          保留服务器原有 public/uploads。
          HTTP IP 内测使用 NEXT_PUBLIC_APP_URL=http://122.51.183.200 和 COOKIE_SECURE=false。
          启动命令：HOSTNAME=127.0.0.1 PORT=3000 node server.js。
          PM2 名称：link168。
          禁止 migrate reset、force reset、DROP 或清空数据库。
          EOF

          tar -C dist -czf "dist/${RELEASE_NAME}.tar.gz" "${RELEASE_NAME}"
          sha256sum "dist/${RELEASE_NAME}.tar.gz" > "dist/${RELEASE_NAME}.tar.gz.sha256"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"

      - name: Smoke test packaged server
        shell: bash
        run: |
          set -euo pipefail
          cd "dist/${RELEASE_NAME}"
          HOSTNAME=127.0.0.1 PORT=3100 node server.js > /tmp/link168-package.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then
              break
            fi
            sleep 2
          done

          test "$(curl -sS -o /tmp/home.html -w '%{http_code}' http://127.0.0.1:3100/)" = "200"
          test "$(curl -sS -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:3100/login)" = "200"
          test "$(curl -sS -o /tmp/register.html -w '%{http_code}' http://127.0.0.1:3100/register)" = "200"
          test "$(curl -sS -o /tmp/terms.html -w '%{http_code}' http://127.0.0.1:3100/terms)" = "200"
          test "$(curl -sS -o /tmp/me.json -w '%{http_code}' http://127.0.0.1:3100/api/auth/me)" = "401"
          ! grep -q 'XXXXXXXXXXXXXX' /tmp/home.html
          ! grep -q '链接被系统判定为不安全' /tmp/home.html
          echo "PACKAGE_SMOKE=PASS"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: |
            dist/${{ env.RELEASE_NAME }}.tar.gz
            dist/${{ env.RELEASE_NAME }}.tar.gz.sha256
            dist/${{ env.RELEASE_NAME }}/RELEASE_INFO.txt
            dist/${{ env.RELEASE_NAME }}/DEPLOY_TEST.txt
          if-no-files-found: error
          retention-days: 14
