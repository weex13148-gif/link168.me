name: Build Linux Standalone

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - release/internal-test-20260630
  pull_request:
    branches:
      - master

concurrency:
  group: link168-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/link168_ci
      SESSION_SECRET: ci-session-secret-please-replace-32-characters
      ADMIN_SECRET: ci-admin-secret-please-replace-32-characters
      CONFIG_ENCRYPTION_KEY: ci-config-encryption-key-32-characters
      NEXT_PUBLIC_APP_URL: https://example.invalid
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      AUTH_RATE_LIMIT_BYPASS: "false"
      RATE_LIMIT_STORE: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Build standalone
        id: build_app
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link168-check-logs-${{ github.sha }}
          path: |
            lint.log
            typecheck.log
            build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce validation gate
        if: always()
        shell: bash
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "build=${{ steps.build_app.outcome }}"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.build_app.outcome }}" = "success"
          test -f .next/standalone/server.js
          test -d .next/static

      - name: Prepare deployment package
        shell: bash
        run: |
          set -e
          mkdir -p deploy-package/.next
          cp -a .next/standalone/. deploy-package/
          cp -a .next/static deploy-package/.next/static
          if [ -d public ]; then
            cp -a public deploy-package/public
          fi
          cp -a prisma deploy-package/prisma
          cp -a package.json deploy-package/package.json
          printf '%s\n' "$GITHUB_SHA" > deploy-package/GIT_SHA
          tar -czf link168-linux-standalone.tar.gz -C deploy-package .
          ls -lh link168-linux-standalone.tar.gz

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: link168-linux-standalone-${{ github.sha }}
          path: link168-linux-standalone.tar.gz
          retention-days: 7
