name: Validate Internal Test Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - release/internal-test-20260630
  pull_request:
    branches:
      - master

concurrency:
  group: link168-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/link168_ci
      SESSION_SECRET: ci-session-secret-please-replace-32-characters
      ADMIN_SECRET: ci-admin-secret-please-replace-32-characters
      CONFIG_ENCRYPTION_KEY: ci-config-encryption-key-32-characters
      NEXT_PUBLIC_APP_URL: https://example.invalid
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      AUTH_RATE_LIMIT_BYPASS: "false"
      RATE_LIMIT_STORE: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint runtime source
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify production build
        shell: bash
        run: |
          set -e
          test -f .next/BUILD_ID
          test -d .next/server
          test -d .next/static
          echo "Next.js production build is complete"
