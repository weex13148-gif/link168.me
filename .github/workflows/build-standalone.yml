name: Build Linux Standalone

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - release/internal-test-20260630
  pull_request:
    branches:
      - master

concurrency:
  group: link168-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/link168_ci
      SESSION_SECRET: ci-session-secret-please-replace-32-characters
      ADMIN_SECRET: ci-admin-secret-please-replace-32-characters
      CONFIG_ENCRYPTION_KEY: ci-config-encryption-key-32-characters
      NEXT_PUBLIC_APP_URL: https://example.invalid
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      AUTH_RATE_LIMIT_BYPASS: "false"
      RATE_LIMIT_STORE: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build standalone
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -e
          echo '=== .next top level ==='
          find .next -maxdepth 2 -mindepth 1 -printf '%y %p\n' | sort | head -200
          echo '=== server.js candidates ==='
          find .next -maxdepth 6 -type f -name 'server.js' -print
          test -f .next/standalone/server.js
          echo 'standalone/server.js exists'

      - name: Prepare deployment package
        shell: bash
        run: |
          set -e
          mkdir -p deploy-package/.next
          cp -a .next/standalone/. deploy-package/
          if [ -d .next/static ]; then
            cp -a .next/static deploy-package/.next/static
          fi
          if [ -d public ]; then
            cp -a public deploy-package/public
          fi
          cp -a prisma deploy-package/prisma
          cp -a package.json deploy-package/package.json
          printf '%s\n' "$GITHUB_SHA" > deploy-package/GIT_SHA
          tar -czf link168-linux-standalone.tar.gz -C deploy-package .
          ls -lh link168-linux-standalone.tar.gz

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: link168-linux-standalone-${{ github.sha }}
          path: link168-linux-standalone.tar.gz
          retention-days: 7
