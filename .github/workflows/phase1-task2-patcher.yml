name: Phase 1 Task 2 Capability Patcher

on:
  push:
    branches:
      - agent/refactor-phase1-task2-auth-capabilities

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        run: python3 scripts/refactor/apply-phase1-task2.py
      - name: Commit exact changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(identity): use one capability policy for user access"
          git push origin "HEAD:${GITHUB_REF_NAME}"
