name: Governance and Auth Policy Check

on:
  pull_request:
    branches:
      - codex/link168-v2-direction
    paths:
      - 'PRODUCT_CONSTITUTION.md'
      - 'PRD.md'
      - 'PROJECT_RULES.md'
      - 'DOCUMENT_INDEX.md'
      - 'README.md'
      - 'docs/governance/**'
      - 'docs/audits/REMEDIATION_DEVELOPMENT_REPORT.md'
      - 'scripts/governance/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/governance.yml'
      - 'package.json'
      - 'tsconfig.json'
      - 'src/lib/auth-credential-policy.ts'
      - 'src/lib/auth-credential-policy.test.ts'
      - 'src/lib/auth-hardening.ts'
      - 'src/lib/email-verification.ts'
      - 'src/app/api/auth/**'
  push:
    branches:
      - codex/link168-v2-direction
    paths:
      - 'PRODUCT_CONSTITUTION.md'
      - 'PRD.md'
      - 'PROJECT_RULES.md'
      - 'DOCUMENT_INDEX.md'
      - 'README.md'
      - 'docs/governance/**'
      - 'docs/audits/REMEDIATION_DEVELOPMENT_REPORT.md'
      - 'scripts/governance/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/governance.yml'
      - 'package.json'
      - 'tsconfig.json'
      - 'src/lib/auth-credential-policy.ts'
      - 'src/lib/auth-credential-policy.test.ts'
      - 'src/lib/auth-hardening.ts'
      - 'src/lib/email-verification.ts'
      - 'src/app/api/auth/**'

permissions:
  contents: read

jobs:
  governance-and-auth-policy:
    name: Validate governance and auth policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run governance consistency check
        run: npm run governance:check

      - name: Run focused auth policy tests
        run: npm run test:auth
