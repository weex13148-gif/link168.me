# Temporary Console home smoke trigger; do not merge this comment.
name: Governance, Auth and Console Check

on:
  pull_request:
    branches:
      - codex/link168-v2-direction
    paths:
      - 'PRODUCT_CONSTITUTION.md'
      - 'PRD.md'
      - 'PROJECT_RULES.md'
      - 'DOCUMENT_INDEX.md'
      - 'README.md'
      - 'docs/governance/**'
      - 'docs/audits/REMEDIATION_DEVELOPMENT_REPORT.md'
      - 'scripts/governance/**'
      - 'scripts/auth-integration-test.mjs'
      - 'scripts/console-integration-test.mjs'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/governance.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'prisma/schema.prisma'
      - 'prisma.config.ts'
      - 'src/lib/auth-credential-policy.ts'
      - 'src/lib/auth-credential-policy.test.ts'
      - 'src/lib/auth-hardening.ts'
      - 'src/lib/email-verification.ts'
      - 'src/app/api/auth/**'
      - 'src/app/console/**'
      - 'src/components/layout/ConsoleShell.tsx'
      - 'src/components/layout/console-navigation.ts'
      - 'src/components/layout/console-route-policy.ts'
      - 'src/components/layout/console-route-policy.test.ts'
      - 'src/components/workbench/WorkbenchShell.tsx'
      - 'src/components/dashboard-v1/DashboardFrame.tsx'
  push:
    branches:
      - codex/link168-v2-direction
    paths:
      - 'PRODUCT_CONSTITUTION.md'
      - 'PRD.md'
      - 'PROJECT_RULES.md'
      - 'DOCUMENT_INDEX.md'
      - 'README.md'
      - 'docs/governance/**'
      - 'docs/audits/REMEDIATION_DEVELOPMENT_REPORT.md'
      - 'scripts/governance/**'
      - 'scripts/auth-integration-test.mjs'
      - 'scripts/console-integration-test.mjs'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/governance.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'prisma/schema.prisma'
      - 'prisma.config.ts'
      - 'src/lib/auth-credential-policy.ts'
      - 'src/lib/auth-credential-policy.test.ts'
      - 'src/lib/auth-hardening.ts'
      - 'src/lib/email-verification.ts'
      - 'src/app/api/auth/**'
      - 'src/app/console/**'
      - 'src/components/layout/ConsoleShell.tsx'
      - 'src/components/layout/console-navigation.ts'
      - 'src/components/layout/console-route-policy.ts'
      - 'src/components/layout/console-route-policy.test.ts'
      - 'src/components/workbench/WorkbenchShell.tsx'
      - 'src/components/dashboard-v1/DashboardFrame.tsx'

permissions:
  contents: read

jobs:
  governance-auth-and-console:
    name: Validate governance, auth and console navigation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: link168_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d link168_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/link168_ci
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      COOKIE_SECURE: 'false'
      MAIL_ENABLED: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run governance consistency check
        run: npm run governance:check

      - name: Run focused auth policy tests
        run: npm run test:auth

      - name: Run console navigation policy tests
        run: npm run test:console-nav

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run production build
        run: npm run build

      - name: Run authenticated API and Console integration tests
        shell: bash
        run: |
          set -euo pipefail
          npx next start -H 127.0.0.1 -p 3000 > /tmp/link168-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          if ! node scripts/auth-integration-test.mjs; then
            cat /tmp/link168-next.log
            exit 1
          fi
          if ! node scripts/console-integration-test.mjs; then
            cat /tmp/link168-next.log
            exit 1
          fi
