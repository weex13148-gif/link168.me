name: Governance and Auth Check

on:
  pull_request:
    branches:
      - codex/link168-v2-direction
    paths:
      - 'PRODUCT_CONSTITUTION.md'
      - 'PRD.md'
      - 'PROJECT_RULES.md'
      - 'DOCUMENT_INDEX.md'
      - 'README.md'
      - 'docs/governance/**'
      - 'docs/audits/REMEDIATION_DEVELOPMENT_REPORT.md'
      - 'scripts/governance/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/governance.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'prisma/schema.prisma'
      - 'prisma.config.ts'
      - 'src/lib/auth-credential-policy.ts'
      - 'src/lib/auth-credential-policy.test.ts'
      - 'src/lib/auth-hardening.ts'
      - 'src/lib/email-verification.ts'
      - 'src/app/api/auth/**'
  push:
    branches:
      - codex/link168-v2-direction
    paths:
      - 'PRODUCT_CONSTITUTION.md'
      - 'PRD.md'
      - 'PROJECT_RULES.md'
      - 'DOCUMENT_INDEX.md'
      - 'README.md'
      - 'docs/governance/**'
      - 'docs/audits/REMEDIATION_DEVELOPMENT_REPORT.md'
      - 'scripts/governance/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/governance.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'prisma/schema.prisma'
      - 'prisma.config.ts'
      - 'src/lib/auth-credential-policy.ts'
      - 'src/lib/auth-credential-policy.test.ts'
      - 'src/lib/auth-hardening.ts'
      - 'src/lib/email-verification.ts'
      - 'src/app/api/auth/**'

permissions:
  contents: read

jobs:
  governance-and-auth:
    name: Validate governance and email authentication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/link168_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run governance consistency check
        run: npm run governance:check

      - name: Run focused auth policy tests
        run: npm run test:auth

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck
