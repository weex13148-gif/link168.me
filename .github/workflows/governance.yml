name: Governance Check

on:
  pull_request:
    branches:
      - codex/link168-v2-direction
    paths:
      - 'PRODUCT_CONSTITUTION.md'
      - 'PRD.md'
      - 'PROJECT_RULES.md'
      - 'DOCUMENT_INDEX.md'
      - 'README.md'
      - 'docs/governance/**'
      - 'scripts/governance/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/governance.yml'
      - 'package.json'
  push:
    branches:
      - codex/link168-v2-direction
    paths:
      - 'PRODUCT_CONSTITUTION.md'
      - 'PRD.md'
      - 'PROJECT_RULES.md'
      - 'DOCUMENT_INDEX.md'
      - 'README.md'
      - 'docs/governance/**'
      - 'scripts/governance/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/governance.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  governance:
    name: Validate governance files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run governance consistency check
        run: npm run governance:check
