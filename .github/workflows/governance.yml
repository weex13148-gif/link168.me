# Temporary source snapshot export for C workspace isolation audit; do not merge.
name: Governance, Auth, Console and Workspace Check

on:
  pull_request:
    branches:
      - codex/link168-v2-direction
    paths:
      - 'PRODUCT_CONSTITUTION.md'
      - 'PRD.md'
      - 'PROJECT_RULES.md'
      - 'DOCUMENT_INDEX.md'
      - 'README.md'
      - 'docs/governance/**'
      - 'docs/audits/REMEDIATION_DEVELOPMENT_REPORT.md'
      - 'scripts/governance/**'
      - 'scripts/auth-integration-test.mjs'
      - 'scripts/console-integration-test.mjs'
      - 'scripts/console-mobile-browser-test.cjs'
      - 'scripts/workspace-invitation-integration-test.mjs'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/governance.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'prisma/**'
      - 'src/lib/auth-credential-policy.ts'
      - 'src/lib/auth-credential-policy.test.ts'
      - 'src/lib/auth-hardening.ts'
      - 'src/lib/email-verification.ts'
      - 'src/lib/mail.ts'
      - 'src/lib/workspace/**'
      - 'src/app/api/auth/**'
      - 'src/app/api/workspaces/**'
      - 'src/app/api/workspace-invitations/**'
      - 'src/app/workspace-invitations/**'
      - 'src/app/console/**'
      - 'src/components/workspace/**'
      - 'src/components/layout/ConsoleShell.tsx'
      - 'src/components/layout/console-navigation.ts'
      - 'src/components/layout/console-route-policy.ts'
      - 'src/components/layout/console-route-policy.test.ts'
      - 'src/components/workbench/WorkbenchShell.tsx'
      - 'src/components/dashboard-v1/DashboardFrame.tsx'
  push:
    branches:
      - codex/link168-v2-direction
    paths:
      - 'PRODUCT_CONSTITUTION.md'
      - 'PRD.md'
      - 'PROJECT_RULES.md'
      - 'DOCUMENT_INDEX.md'
      - 'README.md'
      - 'docs/governance/**'
      - 'docs/audits/REMEDIATION_DEVELOPMENT_REPORT.md'
      - 'scripts/governance/**'
      - 'scripts/auth-integration-test.mjs'
      - 'scripts/console-integration-test.mjs'
      - 'scripts/console-mobile-browser-test.cjs'
      - 'scripts/workspace-invitation-integration-test.mjs'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/governance.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'prisma/**'
      - 'src/lib/auth-credential-policy.ts'
      - 'src/lib/auth-credential-policy.test.ts'
      - 'src/lib/auth-hardening.ts'
      - 'src/lib/email-verification.ts'
      - 'src/lib/mail.ts'
      - 'src/lib/workspace/**'
      - 'src/app/api/auth/**'
      - 'src/app/api/workspaces/**'
      - 'src/app/api/workspace-invitations/**'
      - 'src/app/workspace-invitations/**'
      - 'src/app/console/**'
      - 'src/components/workspace/**'
      - 'src/components/layout/ConsoleShell.tsx'
      - 'src/components/layout/console-navigation.ts'
      - 'src/components/layout/console-route-policy.ts'
      - 'src/components/layout/console-route-policy.test.ts'
      - 'src/components/workbench/WorkbenchShell.tsx'
      - 'src/components/dashboard-v1/DashboardFrame.tsx'

permissions:
  contents: read

jobs:
  governance-auth-console-workspace:
    name: Validate governance, auth, console and workspace invitations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: link168_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d link168_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/link168_ci
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      COOKIE_SECURE: 'false'
      MAIL_ENABLED: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run governance consistency check
        run: npm run governance:check

      - name: Run focused auth policy tests
        run: npm run test:auth

      - name: Run console navigation policy tests
        run: npm run test:console-nav

      - name: Run workspace invitation policy tests
        run: npm run test:workspace-invite

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run production build
        run: npm run build

      - name: Install temporary Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run authenticated API, Workspace, Console and mobile browser tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/console-mobile artifacts/integration
          npx next start -H 127.0.0.1 -p 3000 > artifacts/integration/next-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          node scripts/auth-integration-test.mjs 2>&1 | tee artifacts/integration/auth.log
          node scripts/workspace-invitation-integration-test.mjs 2>&1 | tee artifacts/integration/workspace.log
          node scripts/console-integration-test.mjs 2>&1 | tee artifacts/integration/console.log
          node scripts/console-mobile-browser-test.cjs 2>&1 | tee artifacts/console-mobile/browser-test.log

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: artifacts/integration/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Console mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-mobile-evidence
          path: artifacts/console-mobile/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload temporary V2 source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-source-snapshot
          path: |
            src/**
            prisma/**
            scripts/**
            package.json
            tsconfig.json
            next.config.ts
          if-no-files-found: error
          retention-days: 1
