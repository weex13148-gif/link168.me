name: P0 One-time Autofix

on:
  push:
    branches: [p0-payment-ai-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p0-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-payment-ai-hardening
          fetch-depth: 0

      - name: Apply exact TypeScript narrowing fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('src/app/api/enterprise-ai/chat/route.ts')
          text = route.read_text(encoding='utf-8')
          old = '''  async function refundCredit(reason: string, requestId = "") {
            const refunded = await refundAiCredits({
              userId: user.id,'''
          new = '''  async function refundCredit(reason: string, requestId = "") {
            const refunded = await refundAiCredits({
              userId: user!.id,'''
          if old not in text:
              raise SystemExit('Exact refundCredit narrowing target not found')
          route.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/p0-one-time-autofix.yml')
          workflow.unlink()
          PY

      - name: Commit exact fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "link168-p0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/enterprise-ai/chat/route.ts .github/workflows/p0-one-time-autofix.yml
          git commit -m "fix(ai): stabilize authenticated user narrowing [p0-autofix]"
          git push origin HEAD:p0-payment-ai-hardening
