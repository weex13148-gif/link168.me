name: Link168 CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: link168-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/link168_ci
      ADMIN_SECRET: ci-only-admin-secret-at-least-32-characters
      CONFIG_ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare logs
        run: mkdir -p ci-logs

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run lint 2>&1 | tee ci-logs/lint.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run typecheck 2>&1 | tee ci-logs/typecheck.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: set -o pipefail; npm run build 2>&1 | tee ci-logs/build.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link168-ci-logs
          path: ci-logs
          if-no-files-found: error
          retention-days: 7

      - name: Enforce verification result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.lint.outcome }}" != "success" || "${{ steps.typecheck.outcome }}" != "success" || "${{ steps.build.outcome }}" != "success" ]]; then
            echo "Lint, typecheck, or build failed. Review the link168-ci-logs artifact."
            exit 1
          fi
