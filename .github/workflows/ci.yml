name: Link168 CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: link168-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/link168_ci
      ADMIN_SECRET: ci-only-admin-secret-at-least-32-characters
      CONFIG_ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint and typecheck
        run: npm run check

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
