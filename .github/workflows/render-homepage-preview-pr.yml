name: Inventory Website Pages

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build page inventory
        shell: bash
        run: |
          set -e
          find src/app -type f \( -name 'page.tsx' -o -name 'page.ts' -o -name 'page.jsx' -o -name 'page.js' \) | sort > page-files.txt
          find src/app -type f \( -name 'route.ts' -o -name 'route.js' \) | sort > api-route-files.txt
          PAGE_COUNT=$(wc -l < page-files.txt)
          API_COUNT=$(wc -l < api-route-files.txt)
          {
            echo "PAGE_COUNT=$PAGE_COUNT"
            echo "API_ROUTE_COUNT=$API_COUNT"
            echo
            echo "=== PAGE FILES ==="
            cat page-files.txt
            echo
            echo "=== API ROUTE FILES ==="
            cat api-route-files.txt
          } | tee route-inventory.txt

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: link168-route-inventory
          path: route-inventory.txt
          retention-days: 7
