<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link168 Design Lab Capture</title>
    <style>
      :root {
        --ink: #20201d;
        --muted: #6f6a60;
        --line: #ded8c8;
        --paper: #fbfaf5;
        --green: #657f49;
        --clay: #b87552;
        --blue: #315f8c;
        --deep: #17212c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .frame {
        min-height: 100vh;
        padding: 30px clamp(18px, 4vw, 56px);
        overflow: hidden;
      }
      .A { --tone: var(--clay); --soft: #f3e3d4; --bg: #fffaf4; --panel: #ffffff; }
      .B { --tone: var(--green); --soft: #e4ecd9; --bg: #f7faf2; --panel: #ffffff; }
      .C { --tone: var(--blue); --soft: #dce8f2; --bg: #f4f8fb; --panel: #ffffff; }
      .frame.A { background: linear-gradient(135deg, #fffaf4 0%, #f3e3d4 100%); }
      .frame.B { background: linear-gradient(135deg, #f7faf2 0%, #e4ecd9 100%); }
      .frame.C { background: linear-gradient(135deg, #f4f8fb 0%, #dce8f2 100%); }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 34px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
      }
      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: var(--tone);
        color: white;
        font-weight: 1000;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 13px;
        border-radius: 999px;
        background: rgba(255,255,255,.68);
        border: 1px solid var(--line);
        color: var(--tone);
        font-size: 13px;
        font-weight: 900;
      }
      .home {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
        gap: 56px;
        align-items: center;
      }
      h1 {
        margin: 0;
        max-width: 800px;
        font-size: clamp(42px, 5vw, 76px);
        line-height: 1.05;
        letter-spacing: 0;
      }
      h2 {
        margin: 0;
        font-size: clamp(30px, 3vw, 46px);
        line-height: 1.12;
      }
      p { color: var(--muted); line-height: 1.75; }
      .lead { max-width: 650px; font-size: 18px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      button, .button {
        border: 0;
        border-radius: 12px;
        min-height: 46px;
        padding: 0 18px;
        background: var(--tone);
        color: white;
        font-weight: 900;
      }
      .button.secondary {
        display: inline-flex;
        align-items: center;
        background: rgba(255,255,255,.78);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .phone {
        width: min(100%, 320px);
        min-height: 600px;
        margin: 0 auto;
        padding: 48px 20px 22px;
        border: 10px solid #211d1a;
        border-radius: 42px;
        background: linear-gradient(180deg, white, var(--soft));
        box-shadow: 0 24px 54px rgba(0,0,0,.18);
      }
      .avatar {
        width: 72px;
        height: 72px;
        margin: 0 auto 14px;
        border-radius: 24px;
        background: var(--tone);
        color: white;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 900;
      }
      .phone strong, .phone small { display: block; text-align: center; }
      .phone strong { font-size: 22px; }
      .phone small { color: var(--muted); margin-top: 6px; }
      .link-card {
        display: block;
        margin-top: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: white;
        font-weight: 900;
      }
      .metric-row, .task-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 24px;
      }
      .metric, .task, .panel {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255,255,255,.76);
      }
      .metric b { display: block; color: var(--tone); font-size: 28px; }
      .dashboard {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 330px;
        gap: 20px;
        align-items: stretch;
      }
      aside, .main-panel, .preview {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255,255,255,.76);
      }
      aside { padding: 20px; }
      nav a {
        display: block;
        padding: 12px;
        border-radius: 12px;
        color: var(--muted);
        font-weight: 800;
      }
      nav a.active {
        background: var(--soft);
        color: var(--tone);
      }
      .main-panel { padding: 22px; }
      .preview { padding: 20px; }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .profile {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 34px;
        align-items: start;
      }
      .profile-page {
        max-width: 680px;
        padding: 38px;
        border-radius: 30px;
        background: rgba(255,255,255,.78);
        border: 1px solid var(--line);
      }
      .story-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }
      .qr {
        min-height: 360px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255,255,255,.72);
      }
      .qr-box {
        width: 170px;
        height: 170px;
        margin: 22px auto;
        background:
          linear-gradient(90deg, var(--tone) 12px, transparent 12px) 0 0 / 34px 34px,
          linear-gradient(var(--tone) 12px, transparent 12px) 0 0 / 34px 34px,
          white;
        border: 12px solid white;
        box-shadow: 0 0 0 1px var(--line);
      }
      @media (max-width: 820px) {
        .frame { padding: 18px; }
        header { margin-bottom: 18px; }
        .brand img { width: 66px; }
        .home, .dashboard, .profile {
          grid-template-columns: 1fr;
          gap: 18px;
        }
        h1 { font-size: 38px; }
        h2 { font-size: 28px; }
        .lead { font-size: 16px; }
        .metric-row, .task-row, .cards, .story-grid { grid-template-columns: 1fr; }
        .phone { min-height: 500px; }
        aside { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const data = {
        A: {
          name: "温润品牌编辑部",
          person: "小雨内容工作室",
          title: "把内容、服务和合作入口，整理成一张值得分享的经营名片。",
          lead: "适合自媒体创作者、咨询师、小品牌。公开主页像一张可传播的品牌页面，重点展示故事、作品、社媒、课程社群和商务合作。",
          nav: ["主页故事", "精选内容", "合作入口", "内容日历", "AI 创作"],
          tasks: ["完善品牌故事", "补充商务合作说明", "生成下周小红书选题"],
          links: ["商务合作", "课程社群", "公众号精选文章", "AI 帮我生成选题"],
          stats: ["7 篇精选内容", "3 个合作入口", "12 条本周咨询"]
        },
        B: {
          name: "现代创作者工作台",
          person: "林记花艺",
          title: "5 分钟创建主页，马上获得链接和二维码。",
          lead: "适合 Link168 主后台。以任务、状态、组件管理和实时预览为核心，把用户从注册带到可分享名片和二维码。",
          nav: ["经营概览", "我的名片", "内容与服务", "分享二维码", "访问数据"],
          tasks: ["添加微信客服", "发布今日优惠", "下载门店二维码"],
          links: ["今日花束", "到店预约", "微信客服", "本周优惠活动"],
          stats: ["86 次访问", "24 次点击", "6 个预约"]
        },
        C: {
          name: "AI 经营中枢",
          person: "周然品牌咨询",
          title: "主页不只展示你，还能接待客户、整理线索、提醒跟进。",
          lead: "适合付费 AI、经营版和企业版。用知识库、AI 顾问、线索、经营简报和任务队列表达高价值能力。",
          nav: ["经营简报", "AI 顾问", "客户线索", "知识库", "跟进建议"],
          tasks: ["回复 3 条高意向线索", "更新服务知识库", "生成本周复盘"],
          links: ["服务方案", "成功案例", "预约诊断", "向 AI 顾问咨询"],
          stats: ["48 次咨询", "6 条高意向", "3 个待跟进"]
        }
      };
      const params = new URLSearchParams(location.search);
      const direction = data[params.get("direction")] ? params.get("direction") : "A";
      const screen = params.get("screen") || "home";
      const d = data[direction];
      const app = document.querySelector("#app");
      const header = `
        <header>
          <div class="brand"><span class="brand-mark">L</span><span>Link168 · ${d.name}</span></div>
          <span class="pill">Design Lab / ${screen}</span>
        </header>
      `;
      const phone = `
        <div class="phone">
          <div class="avatar">${d.person.slice(0, 1)}</div>
          <strong>${d.person}</strong>
          <small>${direction === "A" ? "内容创作者 / 商务合作" : direction === "B" ? "本地小商家 / 预约咨询" : "一人公司 / AI 顾问已启用"}</small>
          ${d.links.map((item) => `<span class="link-card">${item}</span>`).join("")}
        </div>
      `;
      const home = `
        <section class="home">
          <div>
            <span class="pill">${d.name}</span>
            <h1>${d.title}</h1>
            <p class="lead">${d.lead}</p>
            <div class="actions"><button>免费创建名片</button><span class="button secondary">查看示例</span></div>
            <div class="metric-row">${d.stats.map((item) => `<div class="metric"><b>${item.split(" ")[0]}</b><span>${item.replace(item.split(" ")[0], "").trim()}</span></div>`).join("")}</div>
          </div>
          ${phone}
        </section>
      `;
      const dashboard = `
        <section class="dashboard">
          <aside><nav>${d.nav.map((item, i) => `<a class="${i === 0 ? "active" : ""}">${item}</a>`).join("")}</nav></aside>
          <div class="main-panel">
            <div class="toolbar"><div><span class="pill">${d.name}</span><h2>今天先完成这些经营动作</h2></div><button>添加内容</button></div>
            <div class="task-row">${d.tasks.map((item) => `<div class="task"><b>${item}</b><p>系统会同步更新公开主页预览，并提示是否已经发布。</p></div>`).join("")}</div>
            <div class="cards" style="margin-top:14px">${d.stats.map((item) => `<div class="metric"><b>${item.split(" ")[0]}</b><span>${item.replace(item.split(" ")[0], "").trim()}</span></div>`).join("")}</div>
          </div>
          <div class="preview"><h2>实时预览</h2>${phone}</div>
        </section>
      `;
      const profile = `
        <section class="profile">
          <div class="profile-page">
            <span class="pill">${d.name}</span>
            <h1>${d.person}</h1>
            <p class="lead">${d.lead}</p>
            ${d.links.map((item) => `<span class="link-card">${item}</span>`).join("")}
            <div class="story-grid">${d.tasks.map((item) => `<div class="panel"><b>${item}</b><p>清楚告诉访客下一步可以如何联系、预约或继续了解。</p></div>`).join("")}</div>
          </div>
          <div class="qr"><h2>适合二维码传播</h2><p>公开主页必须适合微信、海报、门店物料和社交平台截图传播。</p><div class="qr-box"></div><button>下载二维码</button></div>
        </section>
      `;
      app.innerHTML = `<main class="frame ${direction}">${header}${screen === "dashboard" ? dashboard : screen === "profile" ? profile : home}</main>`;
    </script>
  </body>
</html>
